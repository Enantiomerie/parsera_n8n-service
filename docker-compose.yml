services:
  parsera:
    image: enantiomerie/parsera_n8n-service:latest
    container_name: parsera
    restart: unless-stopped

    environment:
      TZ: Europe/Berlin
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}

      GEMINI_API_KEY: ${GEMINI_API_KEY:-change_me}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}

      OPENAI_API_KEY: ${OPENAI_API_KEY:-change_me}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}

      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama2}

      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-60}
      VALIDATE_JSON_OUTPUT: ${VALIDATE_JSON_OUTPUT:-true}

      PLAYWRIGHT_STEALTH: ${PLAYWRIGHT_STEALTH:-true}
      CUSTOM_COOKIES_JSON: ${CUSTOM_COOKIES_JSON:-}
      PARSERA_SCROLLS_LIMIT: ${PARSERA_SCROLLS_LIMIT:-0}

    shm_size: 1gb
    init: true

    security_opt:
      - no-new-privileges:true

    networks:
      - n8n_net

networks:
  n8n_net:
    external: true
