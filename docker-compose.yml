services:
  browserless:
    image: browserless/chrome:latest
    networks:
      - n8n_net
    environment:
      TOKEN: ${BROWSERLESS_TOKEN:-}
      DEBUG: "false"
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  parsera:
    image: enantiomerie/parsera:latest
    networks:
      - n8n_net
    depends_on:
      browserless:
        condition: service_healthy

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  n8n_net:
    external: true
