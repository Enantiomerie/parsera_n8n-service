version: "3.8"

services:
  parsera:
    build: .
    container_name: parsera

    ports:
      - "8000:8000"

    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}

      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-pro}

      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-3.5-turbo}

      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama2}

      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-60}

      MAX_URL_LENGTH: ${MAX_URL_LENGTH:-2000}
      MAX_EXTRACTION_RULES_LENGTH: ${MAX_EXTRACTION_RULES_LENGTH:-5000}

      VALIDATE_JSON_OUTPUT: ${VALIDATE_JSON_OUTPUT:-true}

      PLAYWRIGHT_STEALTH: ${PLAYWRIGHT_STEALTH:-true}
      CUSTOM_COOKIES_JSON: ${CUSTOM_COOKIES_JSON:-""}

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  default:
    external: true
    name: n8n_net
