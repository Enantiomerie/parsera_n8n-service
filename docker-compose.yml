services:
  parsera:
    image: enantiomerie/parsera_n8n-service:latest
    container_name: parsera
    ports:
      - "8000:8000"

    environment:
      SERVICE_NAME: ${SERVICE_NAME:-parsera-n8n-service}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}

      PARSERA_API_KEY: ${PARSERA_API_KEY:-}

      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}

      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}

      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama2}

      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-60}
      DEFAULT_WAIT_TIMEOUT_MS: ${DEFAULT_WAIT_TIMEOUT_MS:-15000}

      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright

    ipc: host
    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    networks:
      - n8n_net

networks:
  n8n_net:
    external: true
