services:
  browserless:
    image: browserless/chrome:latest
    networks:
      - n8n_net
    environment:
      TOKEN: ${BROWSERLESS_TOKEN:-}
      DEBUG: "false"
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  parsera:
    image: enantiomerie/parsera:latest
    networks:
      - n8n_net

    # Read runtime configuration from .env (copy from .env.example)
    env_file:
      - .env

    # Hints for configuring LLM providers (set these in .env):
    #
    # Gemini
    #   - LLM_PROVIDER=gemini
    #   - GEMINI_API_KEY=your-gemini-api-key
    #
    # OpenAI
    #   - LLM_PROVIDER=openai
    #   - OPENAI_API_KEY=your-openai-key
    #   - (optional) OPENAI_MODEL=gpt-4 or gpt-3.5-turbo
    #
    # Ollama (local/self-hosted)
    #   - LLM_PROVIDER=ollama
    #   - OLLAMA_BASE_URL=http://ollama:11434 (or reachable host/port)
    #   - OLLAMA_MODEL=llama2
    #   - Ensure an Ollama service is available on the same Docker network or set OLLAMA_BASE_URL to a reachable address
    #
    # Notes:
    #   - Copy .env.example to .env and edit only the secrets and values you need.
    #   - Keep API keys out of source control; do NOT commit .env.
    #   - Only provide the credentials required by the LLM provider you select.

    depends_on:
      browserless:
        condition: service_healthy

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  n8n_net:
    external: true
